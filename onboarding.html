<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Study - Onboarding</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#6D28D9,#2563EB);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
background:white;
color:#222;
width:90%;
max-width:420px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

h1{
margin-bottom:10px;
}

p{
margin-bottom:25px;
color:#666;
}

button{

width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;

}

.primary{

background:#6D28D9;
color:white;

}

.primary:hover{

background:#5B21B6;

}
/* Floating background */

.floating-icons{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.icon{
position:absolute;
font-size:50px;
opacity:.15;
animation:float 12s ease-in-out infinite;
}

.icon1{top:8%;left:10%;}
.icon2{top:70%;left:15%;animation-delay:2s;}
.icon3{top:18%;right:12%;animation-delay:4s;}
.icon4{top:75%;right:18%;animation-delay:6s;}
.icon5{top:15%;left:45%;animation-delay:8s;}
.icon6{top:50%;left:30%;animation-delay:10s;}
.icon7{top:35%;right:35%;animation-delay:3s;}
.icon8{top:82%;left:55%;animation-delay:5s;}

@keyframes float{

0%,100%{
transform:translateY(0px) rotate(0deg);
}

50%{
transform:translateY(-30px) rotate(12deg);
}

}

.card{
position:relative;
z-index:2;
}
</style>

</head>

<body>
<div class="floating-icons">
    <span class="icon icon1">🧠</span>
    <span class="icon icon2">📚</span>
    <span class="icon icon3">🎓</span>
    <span class="icon icon4">📝</span>
    <span class="icon icon5">🏆</span>
    <span class="icon icon6">⭐</span>
    <span class="icon icon7">💡</span>
    <span class="icon icon8">📖</span>
</div>
<div class="card">

<h1>Welcome 👋</h1>

<p>Let's personalize your Mini Study experience.</p>

<button class="primary" id="continueBtn">
Continue
</button>

</div>
<script>
document.getElementById("continueBtn").addEventListener("click", function () {
    window.location.href = "study-field.html";
});
</script>
</body>

</html>
