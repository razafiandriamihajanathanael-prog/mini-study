<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Study - Onboarding</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#6D28D9,#2563EB);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
background:white;
color:#222;
width:90%;
max-width:420px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

h1{
margin-bottom:10px;
}

p{
margin-bottom:25px;
color:#666;
}

button{

width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;

}

.primary{

background:#6D28D9;
color:white;

}

.primary:hover{

background:#5B21B6;

}

</style>

</head>

<body>

<div class="card">

<h1>Welcome 👋</h1>

<p>Let's personalize your Mini Study experience.</p>

<button class="primary">
Continue
</button>

</div>

</body>

</html>
