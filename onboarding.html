<!DOCTYPE html>

<title>Mini Study - Onboarding</title>

<style>
.floating-emojis{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.floating-emojis span{
    position:absolute;
    font-size:32px;
    opacity:.18;
    animation:floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translateY(110vh) rotate(0deg);
    }

    to{
        transform:translateY(-120vh) rotate(360deg);
    }

}
.floating-emojis span:nth-child(1){left:3%;animation-duration:18s;}
.floating-emojis span:nth-child(2){left:8%;animation-duration:24s;}

.floating-emojis span:nth-child(18){left:18%;animation-delay:2s;animation-duration:18s;}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#6D28D9,#2563EB);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
background:white;

width:90%;

padding:30px;

h1{
margin-bottom:10px;
}

margin-bottom:25px;
color:#666;
}

button{

width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;

}

.primary{

background:#6D28D9;
color:white;

}

.primary:hover{

background:#5B21B6;

}


.card{
position:relative;
z-index:2;
}
