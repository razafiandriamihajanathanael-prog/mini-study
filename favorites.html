<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#eef2ff,#f8fafc,#ffffff);
min-height:100vh;
padding:30px;
color:#1e293b;
}

.container{
max-width:1100px;
margin:auto;
padding-bottom:120px;
}

h1{
font-size:40px;
margin-bottom:10px;
}

.subtitle{
color:#64748b;
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.tag{
display:inline-block;
padding:6px 14px;
border-radius:20px;
background:#ede9fe;
color:#6d28d9;
font-weight:bold;
margin-bottom:15px;
}

.card h2{
margin-bottom:10px;
}

.card p{
line-height:1.6;
color:#475569;
}

.remove-btn{
margin-top:18px;
padding:10px 14px;
border:none;
border-radius:12px;
background:#fee2e2;
color:#be123c;
font-weight:bold;
cursor:pointer;
}

.remove-btn:hover{
background:#fecdd3;
}

#emptyMessage{
text-align:center;
margin-top:50px;
color:#64748b;
}

#emptyMessage h2{
margin-bottom:10px;
}

.bottom-nav{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:540px;
display:flex;
justify-content:space-around;
align-items:center;
padding:12px;
background:rgba(255,255,255,.95);
backdrop-filter:blur(18px);
border-radius:24px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
z-index:999;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:#64748b;
font-size:24px;
font-weight:bold;
padding:8px 12px;
border-radius:16px;
}

.nav-item span{
font-size:12px;
margin-top:4px;
}

.nav-item.active{
color:white;
background:linear-gradient(135deg,#6d28d9,#2563eb);
}
body.dark-mode{
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
color:white;
}

body.dark-mode .card{
background:#1e293b;
}

body.dark-mode .card h2{
color:white;
}

body.dark-mode .card p{
color:#cbd5e1;
}

body.dark-mode .subtitle{
color:#94a3b8;
}

body.dark-mode .tag{
background:#312e81;
color:#c4b5fd;
}

body.dark-mode .bottom-nav{
background:#0f172a;
}

body.dark-mode .nav-item{
color:#cbd5e1;
}
</style>

</head>

<body>

<div class="container">

<h1>❤️ Favorites</h1>

<p class="subtitle">
Your saved courses and study cards will appear here.
</p>

<div class="grid" id="favoritesGrid"></div>

<div id="emptyMessage">
<h2>No favorites yet</h2>
<p>Tap the heart on any course or study card to save it here.</p>
</div>

</div>

<nav class="bottom-nav">

<a href="study-field.html" class="nav-item">
🏠
<span>Home</span>
</a>

<a href="dashboard.html" class="nav-item">
📚
<span>Courses</span>
</a>

<a href="favorites.html" class="nav-item active">
❤️
<span>Favorites</span>
</a>

<a href="#" class="nav-item">
👤
<span>Profile</span>
</a>

</nav>

<script>
let favorites =
JSON.parse(localStorage.getItem("miniStudyFavorites")) || [];

const favoritesGrid = document.getElementById("favoritesGrid");
const emptyMessage = document.getElementById("emptyMessage");

function displayFavorites(){

    favoritesGrid.innerHTML = "";

    if(favorites.length === 0){
        emptyMessage.style.display = "block";
        return;
    }

    emptyMessage.style.display = "none";

    favorites.forEach(function(item, index){

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="tag">${item.course}</div>
            <h2>${item.title}</h2>
            <p>${item.text}</p>
            <button class="remove-btn" onclick="removeFavorite(${index})">
                Remove from Favorites
            </button>
        `;

        favoritesGrid.appendChild(card);
    });
}

function removeFavorite(index){

    favorites.splice(index, 1);

    localStorage.setItem(
        "miniStudyFavorites",
        JSON.stringify(favorites)
    );

    displayFavorites();
}

displayFavorites();
</script>
<script src="theme.js"></script>
</body>
</html>
