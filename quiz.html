<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Study - Quiz</title>

<style>
:root{
  --purple:#6d28d9;
  --blue:#2563eb;
  --navy:#0f172a;
  --text:#334155;
  --soft:#f8fafc;
  --white:#ffffff;
  --green:#16a34a;
  --red:#dc2626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  padding:30px;
  color:var(--navy);
  background:
    radial-gradient(circle at 10% 10%, rgba(196,181,253,.55), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(147,197,253,.50), transparent 30%),
    linear-gradient(145deg,#f8fafc,#eef2ff,#eff6ff);
}

.quiz-container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding-bottom:110px;
}

.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:24px;
}

.quiz-header h1{
  font-size:32px;
}

.quiz-header p{
  color:#64748b;
  margin-top:5px;
}

.back-button{
  text-decoration:none;
  color:white;
  font-weight:bold;
  padding:12px 18px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  transition:.25s;
}

.back-button:hover{
  transform:translateY(-2px);
}

.progress-card{
  background:white;
  padding:20px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 12px 30px rgba(15,23,42,.08);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-weight:bold;
}

.progress-track{
  width:100%;
  height:10px;
  border-radius:999px;
  background:#e2e8f0;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--purple),var(--blue));
  transition:.3s;
}

.quiz-card{
  background:white;
  padding:32px;
  border-radius:28px;
  box-shadow:0 18px 45px rgba(15,23,42,.12);
}

.quiz-category{
  display:inline-block;
  margin-bottom:16px;
  padding:7px 12px;
  border-radius:999px;
  color:var(--purple);
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.08em;
  background:#f3e8ff;
}

.question{
  font-size:26px;
  line-height:1.35;
  margin-bottom:25px;
}

.answers{
  display:grid;
  gap:13px;
}

.answer-button{
  width:100%;
  padding:16px;
  border:2px solid #e2e8f0;
  border-radius:16px;
  background:white;
  color:var(--text);
  text-align:left;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}

.answer-button:hover{
  border-color:var(--purple);
  background:#faf5ff;
  transform:translateX(3px);
}

.answer-button.correct{
  color:#166534;
  border-color:#22c55e;
  background:#dcfce7;
}

.answer-button.incorrect{
  color:#991b1b;
  border-color:#ef4444;
  background:#fee2e2;
}

.answer-button:disabled{
  cursor:default;
}

.feedback{
  min-height:26px;
  margin-top:20px;
  font-weight:bold;
}

.feedback.correct{
  color:var(--green);
}

.feedback.incorrect{
  color:var(--red);
}

.quiz-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:22px;
}

.next-button{
  display:none;
  border:none;
  padding:14px 22px;
  border-radius:14px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  transition:.25s;
}

.next-button:hover{
  transform:translateY(-2px);
}

.result-card{
  display:none;
  background:white;
  padding:38px;
  border-radius:28px;
  text-align:center;
  box-shadow:0 18px 45px rgba(15,23,42,.12);
}

.result-emoji{
  font-size:64px;
  margin-bottom:15px;
}

.result-card h2{
  font-size:32px;
  margin-bottom:10px;
}

.result-card p{
  color:#64748b;
  line-height:1.6;
  margin-bottom:20px;
}

.score{
  font-size:44px;
  font-weight:bold;
  color:var(--purple);
  margin-bottom:22px;
}

.result-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}

.result-button{
  border:none;
  padding:14px 20px;
  border-radius:14px;
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--blue));
}

.secondary-button{
  color:var(--purple);
  background:#f3e8ff;
}

@media(max-width:600px){
  body{
    padding:18px;
  }

  .quiz-header{
    flex-direction:column;
    align-items:flex-start;
  }

  .quiz-card{
    padding:24px;
  }

  .question{
    font-size:22px;
  }

  .back-button{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<main class="quiz-container">

  <header class="quiz-header">
    <div>
      <h1>🧠 Quick Quiz</h1>
      <p>Test your knowledge one question at a time.</p>
    </div>

    <a href="dashboard.html" class="back-button">
      ← Dashboard
    </a>
  </header>

  <section class="progress-card" id="progressCard">
    <div class="progress-top">
      <span id="questionNumber">Question 1 of 5</span>
      <span id="scoreDisplay">Score: 0</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>

  <section class="quiz-card" id="quizCard">

    <span class="quiz-category" id="quizCategory">
      Strategic Management
    </span>

    <h2 class="question" id="questionText"></h2>

    <div class="answers" id="answerContainer"></div>

    <p class="feedback" id="feedback"></p>

    <div class="quiz-actions">
      <button class="next-button" id="nextButton">
        Next Question →
      </button>
    </div>

  </section>

  <section class="result-card" id="resultCard">
    <div class="result-emoji" id="resultEmoji">🎉</div>

    <h2>Quiz Complete!</h2>

    <p id="resultMessage">
      Great work. Keep reviewing your Mini Study cards.
    </p>

    <div class="score" id="finalScore">0/5</div>

    <div class="result-actions">
      <button class="result-button" id="restartButton">
        Try Again
      </button>

      <a href="dashboard.html" class="result-button secondary-button">
        Back to Dashboard
      </a>
    </div>
  </section>

</main>

<script>
const quizQuestions = [
  {
    category: "Strategic Management",
    question: "What does SWOT analysis examine?",
    answers: [
      "Sales, wages, operations, and taxes",
      "Strengths, weaknesses, opportunities, and threats",
      "Strategy, workflow, organization, and technology",
      "Suppliers, workers, owners, and customers"
    ],
    correct: 1,
    explanation: "SWOT stands for strengths, weaknesses, opportunities, and threats."
  },
  {
    category: "Business Strategy",
    question: "Which framework evaluates whether a resource is valuable, rare, difficult to imitate, and organized?",
    answers: [
      "PESTEL",
      "Balanced Scorecard",
      "VRIO",
      "Porter's Five Forces"
    ],
    correct: 2,
    explanation: "VRIO evaluates value, rarity, imitability, and organization."
  },
  {
    category: "Competitive Analysis",
    question: "Which model analyzes rivalry, suppliers, buyers, substitutes, and new entrants?",
    answers: [
      "Porter's Five Forces",
      "SWOT",
      "BCG Matrix",
      "Ansoff Matrix"
    ],
    correct: 0,
    explanation: "Porter's Five Forces examines the competitive pressures within an industry."
  },
  {
    category: "Global Business",
    question: "What is globalization?",
    answers: [
      "A company reducing all international operations",
      "The increasing connection of markets, businesses, and countries",
      "A strategy used only by small local businesses",
      "A method of avoiding international trade"
    ],
    correct: 1,
    explanation: "Globalization describes the growing connection and interdependence of markets and countries."
  },
  {
    category: "Management",
    question: "What is a competitive advantage?",
    answers: [
      "A condition that allows a company to perform better than competitors",
      "A legal requirement for every company",
      "A temporary reduction in employee salaries",
      "A company operating without a strategy"
    ],
    correct: 0,
    explanation: "A competitive advantage helps a company create greater value or outperform rivals."
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionText = document.getElementById("questionText");
const quizCategory = document.getElementById("quizCategory");
const answerContainer = document.getElementById("answerContainer");
const feedback = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");
const questionNumber = document.getElementById("questionNumber");
const scoreDisplay = document.getElementById("scoreDisplay");
const progressFill = document.getElementById("progressFill");
const quizCard = document.getElementById("quizCard");
const resultCard = document.getElementById("resultCard");
const progressCard = document.getElementById("progressCard");
const finalScore = document.getElementById("finalScore");
const resultMessage = document.getElementById("resultMessage");
const resultEmoji = document.getElementById("resultEmoji");
const restartButton = document.getElementById("restartButton");

function loadQuestion(){
  answered = false;

  const current = quizQuestions[currentQuestion];

  quizCategory.textContent = current.category;
  questionText.textContent = current.question;
  feedback.textContent = "";
  feedback.className = "feedback";
  nextButton.style.display = "none";
  answerContainer.innerHTML = "";

  questionNumber.textContent =
    "Question " + (currentQuestion + 1) + " of " + quizQuestions.length;

  scoreDisplay.textContent = "Score: " + score;

  progressFill.style.width =
    ((currentQuestion + 1) / quizQuestions.length) * 100 + "%";

  current.answers.forEach(function(answer, index){
    const button = document.createElement("button");

    button.className = "answer-button";
    button.textContent = answer;

    button.addEventListener("click", function(){
      selectAnswer(index, button);
    });

    answerContainer.appendChild(button);
  });
}

function selectAnswer(selectedIndex, selectedButton){
  if(answered){
    return;
  }

  answered = true;

  const current = quizQuestions[currentQuestion];
  const buttons = document.querySelectorAll(".answer-button");

  buttons.forEach(function(button){
    button.disabled = true;
  });

  if(selectedIndex === current.correct){
    score++;
    selectedButton.classList.add("correct");

    feedback.textContent = "Correct! " + current.explanation;
    feedback.className = "feedback correct";
  }else{
    selectedButton.classList.add("incorrect");
    buttons[current.correct].classList.add("correct");

    feedback.textContent = "Not quite. " + current.explanation;
    feedback.className = "feedback incorrect";
  }

  scoreDisplay.textContent = "Score: " + score;
  nextButton.style.display = "inline-block";

  if(currentQuestion === quizQuestions.length - 1){
    nextButton.textContent = "See Results →";
  }else{
    nextButton.textContent = "Next Question →";
  }
}

nextButton.addEventListener("click", function(){
  currentQuestion++;

  if(currentQuestion < quizQuestions.length){
    loadQuestion();
  }else{
    showResults();
  }
});

function showResults(){
  quizCard.style.display = "none";
  progressCard.style.display = "none";
  resultCard.style.display = "block";

  finalScore.textContent = score + "/" + quizQuestions.length;

  const percentage = (score / quizQuestions.length) * 100;

  if(percentage === 100){
    resultEmoji.textContent = "🏆";
    resultMessage.textContent =
      "Perfect score! You are ready for a bigger challenge.";
  }else if(percentage >= 60){
    resultEmoji.textContent = "🎉";
    resultMessage.textContent =
      "Great job! Review the questions you missed and try again.";
  }else{
    resultEmoji.textContent = "📚";
    resultMessage.textContent =
      "Keep studying. Review your Mini Study cards and try the quiz again.";
  }

  localStorage.setItem("miniStudyLastQuizScore", score);
  localStorage.setItem("miniStudyQuizTotal", quizQuestions.length);
}

restartButton.addEventListener("click", function(){
  currentQuestion = 0;
  score = 0;

  quizCard.style.display = "block";
  progressCard.style.display = "block";
  resultCard.style.display = "none";

  loadQuestion();
});

loadQuestion();
</script>

</body>
</html>
